# Xcode project definition (generated with XcodeGen: `xcodegen generate`).
# BUNDLE_ID and TEAM_ID come from the environment; see README.md.
name: Expenses
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    APP_GROUP_ID: group.${BUNDLE_ID}
targets:
  Expenses:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (target presets default to iPhone + iPad)
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Kharcha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
    entitlements:
      path: Config/Expenses.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    dependencies:
      - target: ExpensesShare
    scheme: {}
  ExpensesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.share
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Share-Info.plist
      properties:
        CFBundleDisplayName: Kharcha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 3
    entitlements:
      path: Config/ExpensesShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
